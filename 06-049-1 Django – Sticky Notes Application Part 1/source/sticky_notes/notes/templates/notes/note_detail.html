<!-- notes/templates/notes/note_detail.html -->
{% extends 'base.html' %}

{% block title %}
Sticky Notes - {{ note.title }}
{% endblock %}

{% block content %}
<div class="note-detail-card">
    <div class="pin"></div>
    <h2>{{ note.title }}</h2>
    <div class="note-body">
        <p>{{ note.content }}</p>
    </div>
    <p class="timestamp">
        <strong>Created at:</strong> {{ note.created_at|date:"F d, Y, H:i" }}
    </p>
    <div class="detail-actions">
        <a href="{% url 'note_update' pk=note.pk %}" class="btn btn-primary">Update Note</a>
        <a href="{% url 'note_delete' pk=note.pk %}" class="btn btn-danger">Delete Note</a>
        <a href="{% url 'note_list' %}" class="btn btn-secondary">Back to Note List</a>
    </div>
</div>
{% endblock %}
